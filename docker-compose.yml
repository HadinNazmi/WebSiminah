name: jelantah

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jelantah-app
    restart: unless-stopped
    volumes:
      - jelantah_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jelantah-network

  nginx:
    image: nginx:alpine
    container_name: jelantah-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
      - jelantah_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - jelantah-network

  db:
    image: mysql:8.0
    container_name: jelantah-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=50
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-siminah}
      MYSQL_USER: ${DB_USERNAME:-siminah_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    # MySQL tidak diberi 'ports' agar tidak dapat diakses langsung dari luar VPS
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m
    volumes:
      - jelantah_dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jelantah-network

volumes:
  jelantah_dbdata:
    name: jelantah_dbdata
  jelantah_storage:
    name: jelantah_storage

networks:
  jelantah-network:
    name: jelantah-network